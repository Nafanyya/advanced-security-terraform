on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bridgecrewio/checkov
          token: ${{ secrets.TOKEN }}
      - run: cd checkov && checkov -d . -o sarif
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: ./results.sarif
